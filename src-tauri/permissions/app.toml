[[permission]]
identifier = "hud-read"
description = "Read redacted HUD data and installed theme metadata"
commands.allow = ["aide_theme_data", "hud_v1_capabilities_get", "hud_v1_accounts_list", "hud_v1_recommendation_get", "hud_v1_refresh_status_get", "hud_v1_settings_get", "aide_theme_builtins", "aide_theme_builtin"]

[[permission]]
identifier = "hud-actions"
description = "Refresh selected accounts and control trusted windows"
commands.allow = ["aide_theme_resume", "hud_v1_refresh_request", "hud_v1_window_control", "hud_internal_window_layout", "aide_hud_context_menu"]

[[permission]]
identifier = "settings-actions"
description = "Configure the HUD through its trusted settings window"
commands.allow = ["hud_internal_update_check", "hud_internal_update_open", "aide_usb_displays", "aide_theme_list", "aide_theme_install", "aide_theme_select", "aide_theme_uninstall", "hud_v1_accounts_selection_update", "hud_v1_accounts_alias_update", "hud_internal_docs_open", "hud_v1_settings_update", "hud_v1_diagnostics_get", "hud_internal_sources_get", "hud_internal_sources_save", "hud_internal_sources_pick", "hud_internal_startup", "hud_internal_source_get", "hud_internal_source_choose", "hud_internal_source_rescan"]
